<section class="product-page">
  <a href="#" class="link-store">Store homepage</a>

  <div class="product-gallery">
    <button class="gallery-arrow left">&#10094;</button>
    <img
      src="img/craft-wines/craft-wines-zifandel.jpg"
      alt="Product image"
      class="product-main-img"
    />
    <button class="gallery-arrow right">&#10095;</button>

    <div class="product-thumbs">
      <img
        src="img/craft-wines/craft-wines-zifandel.jpg"
        class="thumb active"
        alt="thumb"
      />
    </div>
  </div>

  <div class="product-info">
    <p class="stock-status">In stock</p>
    <h1 class="product-title">Zifandel <span>(093049)</span></h1>
    <p class="product-code">Product code 21</p>
    <p class="product-price-wine">14,00 USD</p>

    <div class="divider"></div>

    <div class="product-actions">
      <div class="quantity-box-product">
        <input type="number" class="quantity-input-product" value="1" min="1" />
        <div class="quantity-arrows-product">
          <button class="arrow up"></button>
          <button class="arrow down"></button>
        </div>
      </div>
      <button class="add-to-cart">Add to cart</button>
    </div>

    <div class="product-description">
      <h2>Description</h2>
      <p>
        This wine is produced from more ripened berries than usual. Core flavors
        are rich, with jammy blackberries and mocha. You can pair this wine with
        braised ribs, chicken enchiladas, or dark chocolate.
      </p>
    </div>
  </div>
</section>
<div class="image-popup">
  <div class="popup-content">
    <div class="popup-thumbs">
      <img
        src="img/craft-wines/craft-wines-zifandel.jpg"
        data-full="img/craft-wines/craft-wines-pinot-noir.jpg"
        class="popup-thumb active"
      />
    </div>

    <img src="" alt="fullscreen" class="popup-main-img" />

    <button class="popup-close">&times;</button>
  </div>
</div>
